<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết nối WiFi - WiFi Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1976D2 0%, #424242 100%);
    }
    .container {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: #1976D2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg { width: 48px; height: 48px; fill: white; }
    h1 { color: #1976D2; margin-bottom: 0.5rem; font-size: 1.5rem; }
    .subtitle { color: #666; margin-bottom: 2rem; }
    .btn {
      width: 100%;
      padding: 1.25rem;
      background: #1976D2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover { background: #1565C0; transform: translateY(-2px); }
    .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
    .btn-connecting {
      background: #4CAF50 !important;
    }
    .wifi-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .status {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .status-info { background: #E3F2FD; color: #1565C0; }
    .status-success { background: #E8F5E9; color: #2E7D32; }
    .status-error { background: #FFEBEE; color: #C62828; }
    .terms {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #666;
      text-align: left;
    }
    .terms a { color: #1976D2; }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="wifi-icon">📶</div>
    <h1>Kết nối WiFi Miễn phí</h1>
    <p class="subtitle">Bấm nút bên dưới để truy cập internet</p>

    <div id="status-container"></div>

    <button id="connect-btn" class="btn" onclick="handleConnect()">
      ⚡ Kết nối ngay
    </button>

    <div class="terms">
      <p>⚠️ Kết nối này chỉ dành cho khách. Vui lòng tuân thủ
      <a href="#" onclick="showTerms(); return false;">điều khoản sử dụng</a>.</p>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status-container');
    const btn = document.getElementById('connect-btn');

    function showStatus(message, type = 'info') {
      statusEl.innerHTML = `<div class="status status-${type}">${message}</div>`;
    }

    function showTerms() {
      alert('Điều khoản sử dụng WiFi:\n\n' +
        '1. Sử dụng WiFi có trách nhiệm\n' +
        '2. Không truy cập nội dung bất hợp pháp\n' +
        '3. Không phát tán phần mềm độc hại\n' +
        '4. Tuân thủ quy định của cơ quan chức năng\n' +
        '5. Mọi hoạt động được ghi log');
    }

    async function handleConnect() {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Đang kết nối...';
      showStatus('Đang xử lý yêu cầu...', 'info');

      try {
        const res = await fetch('/api/guest/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });

        const result = await res.json();

        if (res.ok) {
          btn.innerHTML = '✓ Đã kết nối!';
          btn.classList.add('btn-connecting');
          showStatus('🎉 Kết nối thành công! Bạn có thể truy cập internet ngay bây giờ.', 'success');

          // Redirect sau 2 giây
          setTimeout(() => {
            window.location.href = '/success.html';
          }, 2000);
        } else {
          throw new Error(result.error || 'Kết nối thất bại');
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '⚡ Thử lại';
        showStatus('❌ ' + (err.message || 'Lỗi kết nối. Vui lòng thử lại.'), 'error');
      }
    }

    // Tự động kết nối khi trang load
    window.addEventListener('load', () => {
      setTimeout(handleConnect, 500);
    });
  </script>
</body>
</html>
